# Builds the app on Expo's servers and sends it to App Store Connect and
# Google Play. It never runs on its own, because each build uses the EAS build
# budget. Start it from expo.dev (Project → Workflows) or with:
#   npx eas-cli@latest workflow:run .eas/workflows/store-release.yml -F platform=all
# (from mobile/). Bump `version` in app.config.ts before a release that has
# native changes.

name: Store release

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        description: Which store to build and submit for
        required: true
        default: all
        options:
          - all
          - ios
          - android

jobs:
  build_ios:
    name: Build iOS
    if: ${{ inputs.platform != 'android' }}
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit to App Store Connect
    if: ${{ inputs.platform != 'android' }}
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  build_android:
    name: Build Android
    if: ${{ inputs.platform != 'ios' }}
    type: build
    params:
      platform: android
      profile: production

  submit_android:
    name: Submit to Google Play
    if: ${{ inputs.platform != 'ios' }}
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production
