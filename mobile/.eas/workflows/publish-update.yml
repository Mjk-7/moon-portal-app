# Ships every merge to main that touches the app as an over-the-air update,
# the same as running `npx eas-cli@latest update --channel production
# --environment production` by hand. Runs on Expo's servers (EAS Workflows).
#
# Only JavaScript and assets go out this way. A native change (a new package
# with native code, a permission, an icon) needs a store build instead: bump
# `version` in app.config.ts in the same pull request, so this update lands on
# the new runtime and never reaches the older store builds. Then run the
# "Store release" workflow.

name: Publish update

on:
  push:
    branches: ['main']
    paths:
      - 'mobile/**'

jobs:
  update:
    name: Publish update to production
    type: update
    environment: production
    params:
      channel: production
      platform: all
